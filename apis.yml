name: Wealor
description: >-
  Wealor is an AI-native platform for wealth managers, building a centralized,
  queryable source of truth across wealth management, tax, legal, estate, and
  insurance. The platform captures data from conversations, financial documents,
  tax returns, legal documents, and custodial systems into a single knowledge
  layer, then uses specialized AI agents to automate operational work — account
  opening, client subscriptions, tax optimization, trade rebalancing, and
  billable client-plan generation — directly across legacy partner portals and
  internal systems via APIs and browser automation. Founded in 2026 by Karim
  Bouri and Pierre Depuydt and backed by Y Combinator (P26 batch), Wealor is
  based in San Francisco. As of this profile it is an API consumer with no
  public developer API, documentation, or specification surface.
